# Analysis policy for the Flutter port.
#
# The .NET project enforces `TreatWarningsAsErrors` + .NET analyzers (Recommended) +
# `EnforceCodeStyleInBuild`. This file is the closest equivalent: `flutter_lints` plus
# stricter language modes and a curated rule set, with the important ones promoted to errors
# so an IDE run flags them the same way CI would.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Stricter type checking than the default: no implicit downcasts, no implicit dynamic,
  # no raw types. Every one of these has caught a real bug in a JSON-parsing layer before.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # These are silent-by-default style hints that should fail a build.
    always_declare_return_types: error
    avoid_dynamic_calls: error
    avoid_print: error
    prefer_const_constructors: error
    prefer_const_declarations: error
    prefer_final_locals: error
    prefer_single_quotes: error
    require_trailing_commas: error
    sort_child_properties_last: error
    unawaited_futures: error
    unnecessary_lambdas: error
    unnecessary_parenthesis: error
    unnecessary_statements: error
    use_super_parameters: error
    # `TODO` notes are expected during a phased port; do not fail on them.
    todo: ignore

  exclude:
    # Generated by `flutter gen-l10n` — never hand-edited, so never linted.
    - lib/l10n/generated/**
    # Generated by `flutter build` / `pub get`.
    - build/**
    - .dart_tool/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_put_required_named_parameters_first
    - avoid_bool_literals_in_conditional_expressions
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_returning_null_for_void
    - avoid_unnecessary_containers
    - avoid_void_async
    - await_only_futures
    - cancel_subscriptions
    - cascade_invocations
    - close_sinks
    - collection_methods_unrelated_type
    - comment_references
    - curly_braces_in_flow_control_structures
    - depend_on_referenced_packages
    - directives_ordering
    - discarded_futures
    - empty_catches
    - eol_at_end_of_file
    - exhaustive_cases
    - join_return_with_assignment
    - leading_newlines_in_multiline_strings
    - library_private_types_in_public_api
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_default_cases
    - no_duplicate_case_values
    - no_leading_underscores_for_local_identifiers
    - noop_primitive_operations
    - null_check_on_nullable_type_parameter
    - prefer_asserts_in_initializer_lists
    - prefer_asserts_with_message
    - prefer_final_in_for_each
    - prefer_if_null_operators
    - prefer_inlined_adds
    - prefer_interpolation_to_compose_strings
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_is_not_operator
    - prefer_null_aware_method_calls
    - prefer_relative_imports
    - prefer_typing_uninitialized_variables
    - provide_deprecation_message
    - sized_box_for_whitespace
    - test_types_in_equals
    - throw_in_finally
    - tighten_type_of_initializing_formals
    - type_annotate_public_apis
    - unnecessary_await_in_return
    - unnecessary_late
    - unnecessary_null_aware_assignments
    - unnecessary_overrides
    - unnecessary_raw_strings
    - unnecessary_to_list_in_spreads
    - use_colored_box
    - use_decorated_box
    - use_enums
    - use_if_null_to_convert_nulls_to_bools
    - use_is_even_rather_than_modulo
    - use_named_constants
    - use_setters_to_change_properties
    - use_string_buffers
    - use_test_throws_matchers
    - valid_regexps
    - void_checks
